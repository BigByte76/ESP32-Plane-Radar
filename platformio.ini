; Sunton ESP32-8048S050 (ESP32-S3-WROOM-1 N16R8, 5" 800x480 RGB panel, GT911 touch)
; Board in Arduino IDE: "ESP32S3 Dev Module", Flash 16MB (QIO), PSRAM "OPI PSRAM"
;
; Display pins/timings follow the ESP-IDF reference driver at
; https://github.com/mr-sven/esp32-8048S050C (main/sunton_esp32_8048s050c.c).

[env:esp32-8048s050]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar_16mb.csv
extra_scripts = post:scripts/merge_firmware.py

; N16R8 module: 16 MB QIO flash + 8 MB octal PSRAM (frame buffer + sprites live in PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB-C on this board goes through a CH340 USB-UART to UART0, so no native CDC.
build_flags =
  -std=gnu++17
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DWM_NODEBUG
  -DWM_MDNS

; Exact versions: a library update must be a reviewed change. WiFiManager in
; particular: wifi_setup.cpp's PortalGate relies on its route names and on
; setWebServerCallback() running before its handlers are registered.
lib_deps =
  lovyan03/LovyanGFX@1.3.0
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3
