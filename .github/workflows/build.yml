# Build firmware on push/PR; upload binaries as a short-lived artifact.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: pio run -e esp32-8048s050

      - name: Host unit tests
        run: ./scripts/run-tests.sh

      - name: Merge web-flash image
        run: pio run -t merge -e esp32-8048s050

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plane-radar-esp32-8048s050
          if-no-files-found: error
          path: |
            .pio/build/esp32-8048s050/firmware-merged.bin
            .pio/build/esp32-8048s050/firmware.bin
            .pio/build/esp32-8048s050/bootloader.bin
            .pio/build/esp32-8048s050/partitions.bin
