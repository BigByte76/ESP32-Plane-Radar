# Tag a release (v1.0.0) to attach firmware to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # Sigstore signing for the build-provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build and merge
        run: |
          pio run -e esp32-8048s050
          pio run -t merge -e esp32-8048s050

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp .pio/build/esp32-8048s050/firmware-merged.bin "dist/plane-radar-${VERSION}.bin"
          # App-only image for the portal's /update page (never upload the merged one there).
          cp .pio/build/esp32-8048s050/firmware.bin "dist/plane-radar-${VERSION}-ota.bin"
          (cd dist && sha256sum *.bin > "plane-radar-${VERSION}.sha256")
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      # Signed, verifiable record that these binaries came from this workflow run:
      #   gh attestation verify plane-radar-<tag>-ota.bin -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.bin

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
